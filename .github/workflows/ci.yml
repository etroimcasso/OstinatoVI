name: CI

# Triggers fire on ci/** only — not main, not pull_request. Source reaches main
# only via squash-merge from a ci/<branch> that already ran CI to green; re-running
# on the post-squash main would rebuild the same source for no new signal.
#
# Self-hosted-runner safety: there is deliberately no pull_request-family trigger.
# Anyone can open a fork PR against a public repo, but with push-only triggers a fork
# PR schedules nothing onto the fleet. Do not add pull_request / pull_request_target /
# workflow_run here without re-adjudicating that.
on:
  push:
    branches:
      - 'ci/**'

# Each runner has one workspace and one fixed build directory per platform, so two
# runs on the same branch would fight over both. Superseding the older run keeps that
# impossible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Linux (beefserve, self-hosted, x64) ─────────────────────────────────────
  build-linux:
    name: Linux (beefserve, x64)
    runs-on: [self-hosted, X64, Linux, beefserve]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default workspace clean runs `git clean -ffdx`, which would delete
          # the persisted gitignored build/ every run and force a cold rebuild.
          clean: false

      - name: Install libxtst-dev (SDL3 XTEST dependency)
        run: |
          if ! dpkg -s libxtst-dev >/dev/null 2>&1; then
            sudo -E apt-get update -y
            sudo -E apt-get install -y libxtst-dev
          fi

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # Only the engine is initialized here. The upstream disassembly comes in
          # through the text-corpus staging step below, which also needs the ROM.
          # A job's GITHUB_TOKEN is scoped to this repo only, so the credential is supplied
          # per-invocation with -c (git passes it down to the clone it spawns) rather than
          # written to the runner's git config.
          # Recursive because the engine builds SDL3 and SameBoy from its own submodules.
          # These runners keep their workspace between runs, so sync first: a submodule
          # clone left by an earlier run still carries whatever URL it was created with,
          # and asking the old host for a revision only the new one has fails as
          # "not our ref". deinit does not discard .git/modules/engine, so the retry
          # removes it outright before syncing again.
          # A leftover clone can also simply lack the revision this branch records
          # ("Unable to find current revision"); the same retry covers that.
          git submodule sync --recursive -- engine
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf .git/modules/engine
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Stage the text corpus (rip products the text tests read)
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          # The text-corpus tests read the ripped .dat files out of the upstream
          # disassembly, so this build DOES need original-src. Without this step
          # they skip — and a skip that happens on only some runners hides those
          # tests behind a green tick, which is what it did until 2026-08-25.
          git submodule update --init -- original-src
          if [ -z "${FF6_VANILLA_ROM:-}" ] || [ ! -f "${FF6_VANILLA_ROM}" ]; then
            echo "FF6_VANILLA_ROM is unset or missing on this runner." >&2
            echo "The text tests need the rip corpus; a missing ROM is a provisioning defect, not a skip." >&2
            exit 1
          fi
          # extract_assets.py needs numpy. Prefer the runner's python3; fall back
          # to a venv cached once on the machine.
          RIP_BIN="$(command -v python3)"
          if ! "$RIP_BIN" -c 'import numpy' 2>/dev/null; then
            VENV="$HOME/.cache/ostinatovi-rip-venv"
            if [ ! -x "$VENV/bin/python3" ]; then
              python3 -m venv "$VENV"
              "$VENV/bin/pip" --quiet install numpy
            fi
            RIP_BIN="$VENV/bin/python3"
          fi
          "$RIP_BIN" -c 'import numpy'   # hard proof before ripping
          mkdir -p original-src/vanilla
          cp "$FF6_VANILLA_ROM" original-src/vanilla/
          cd original-src
          # The three steps the upstream `rip` target runs, invoked directly so
          # the step needs no make on any platform.
          "$RIP_BIN" tools/extract_assets.py
          "$RIP_BIN" tools/fix_dlg.py combine en
          "$RIP_BIN" tools/fix_dlg.py combine jp

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      - name: Stage build for manual testing
        run: |
          # The whole build directory, never just the binary — the binary needs the
          # files the build lays out beside it. The workspace lives under the runner
          # service account; /tmp is where the machine's owner can launch the result.
          # The rm clears only the previous staged copy, never the build itself.
          rm -rf /tmp/ostinato-vi-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/ostinato-vi-build

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code (always 0) masks ctest failures
          export SDL_VIDEODRIVER=offscreen   # headless: SDL video init succeeds so the GPU device (lavapipe) is reachable
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-test-results.txt"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: ci-output/

  # ── macOS (ericmacmini, self-hosted, ARM64) ──────────────────────────────────
  build-macos:
    name: macOS (ericmacmini, ARM64)
    runs-on: [self-hosted, macOS, ARM64, ericmacmini]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default workspace clean would delete the persisted gitignored
          # build/ every run — see the Linux job.
          clean: false

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # See the Linux job for why only the engine is initialized, why the credential
          # is supplied per-invocation rather than written to git config, and why a
          # persistent workspace has to sync before it updates.
          git submodule sync --recursive -- engine
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf .git/modules/engine
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Stage the text corpus (rip products the text tests read)
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          # The text-corpus tests read the ripped .dat files out of the upstream
          # disassembly, so this build DOES need original-src. Without this step
          # they skip — and a skip that happens on only some runners hides those
          # tests behind a green tick, which is what it did until 2026-08-25.
          git submodule update --init -- original-src
          if [ -z "${FF6_VANILLA_ROM:-}" ] || [ ! -f "${FF6_VANILLA_ROM}" ]; then
            echo "FF6_VANILLA_ROM is unset or missing on this runner." >&2
            echo "The text tests need the rip corpus; a missing ROM is a provisioning defect, not a skip." >&2
            exit 1
          fi
          # extract_assets.py needs numpy. Prefer the runner's python3; fall back
          # to a venv cached once on the machine.
          RIP_BIN="$(command -v python3)"
          if ! "$RIP_BIN" -c 'import numpy' 2>/dev/null; then
            VENV="$HOME/.cache/ostinatovi-rip-venv"
            if [ ! -x "$VENV/bin/python3" ]; then
              python3 -m venv "$VENV"
              "$VENV/bin/pip" --quiet install numpy
            fi
            RIP_BIN="$VENV/bin/python3"
          fi
          "$RIP_BIN" -c 'import numpy'   # hard proof before ripping
          mkdir -p original-src/vanilla
          cp "$FF6_VANILLA_ROM" original-src/vanilla/
          cd original-src
          # The three steps the upstream `rip` target runs, invoked directly so
          # the step needs no make on any platform.
          "$RIP_BIN" tools/extract_assets.py
          "$RIP_BIN" tools/fix_dlg.py combine en
          "$RIP_BIN" tools/fix_dlg.py combine jp

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      - name: Stage build for manual testing
        run: |
          # Whole build directory to /tmp for the machine's owner — see the Linux job.
          rm -rf /tmp/ostinato-vi-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/ostinato-vi-build

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code masks ctest failures
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/macos-test-results.txt"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ci-output/

  # ── Windows clang-cl (WINDOWS-BVDA56O, self-hosted, x64) ─────────────────────
  build-windows:
    name: Windows clang-cl (WINDOWS-BVDA56O, x64)
    # Pinned by its name-label so the job only ever lands on this machine.
    runs-on: [self-hosted, Windows, X64, windows_x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init engine submodule
        shell: powershell
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd $env:GITHUB_WORKSPACE
          # See the Linux job for why only the engine is initialized, why the credential
          # is supplied per-invocation rather than written to git config, and why a
          # persistent workspace has to sync before it updates.
          git submodule sync --recursive -- engine
          git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
          if ($LASTEXITCODE -ne 0) {
            git submodule deinit -f -- engine
            Remove-Item -Recurse -Force .git/modules/engine -ErrorAction SilentlyContinue
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Stage the text corpus (rip products the text tests read)
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          # See the Linux x64 job: the text-corpus tests read the ripped .dat
          # files, so this build needs original-src and the ROM. A missing ROM is
          # a provisioning defect, not a skip.
          git submodule update --init -- original-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $env:FF6_VANILLA_ROM -or -not (Test-Path $env:FF6_VANILLA_ROM)) {
            Write-Error "FF6_VANILLA_ROM is unset or missing on this runner."
            exit 1
          }
          $rip = "python"
          & $rip -c "import numpy" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $venv = "$env:USERPROFILE\.cache\ostinatovi-rip-venv"
            if (-not (Test-Path "$venv\Scripts\python.exe")) {
              & $rip -m venv $venv
              & "$venv\Scripts\pip.exe" --quiet install numpy
            }
            $rip = "$venv\Scripts\python.exe"
          }
          & $rip -c "import numpy"   # hard proof before ripping
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path original-src\vanilla | Out-Null
          Copy-Item $env:FF6_VANILLA_ROM original-src\vanilla\ -Force
          cd original-src
          # The three steps the upstream `rip` target runs, invoked directly so
          # the step needs no make on Windows.
          & $rip tools/extract_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rip tools/fix_dlg.py combine en
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rip tools/fix_dlg.py combine jp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\ostinato-vi-ci-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL
          if ($LASTEXITCODE -ne 0) {
            # A cache written by a different generator or toolset cannot be reused, and
            # CMake will not overwrite it. Each FetchContent sub-build keeps its own cache
            # too, so the whole directory goes rather than the parts that look guilty.
            Remove-Item C:\ostinato-vi-ci-build -Recurse -Force -ErrorAction SilentlyContinue
            cmake -S $env:GITHUB_WORKSPACE -B C:\ostinato-vi-ci-build `
              -G "Visual Studio 17 2022" -A x64 -T ClangCL
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: powershell
        run: cmake --build C:\ostinato-vi-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\ci-output | Out-Null
          # A held handle on the fixed results name has locked this step before; write a
          # run-unique file (and best-effort clear deletable stale ones) so a stale handle
          # can never block the write.
          Get-ChildItem C:\ci-output\windows-test-results*.txt -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          $results = "C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\ostinato-vi-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell equivalent of `set -o pipefail` — Tee-Object does not update
          # $LASTEXITCODE; the cmd /c exit code is captured after the pipeline. Without
          # this, ctest failures would silently report green.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt

  # ── Linux ARM64 (linmac-arm64, self-hosted) ──────────────────────────────────
  # The three ARM64 jobs share one physical host (macOS on the metal, Linux and
  # Windows in VMs), so they run in series — macOS first, then Linux, then
  # Windows — each needing the one before it. `if: always()` keeps the chain
  # running for full per-platform signal even when an earlier link fails.
  build-linux-arm64:
    name: Linux (linmac-arm64, ARM64)
    runs-on: [self-hosted, Linux, ARM64, linmac-arm64]
    needs: build-macos
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default workspace clean would delete the persisted gitignored
          # build/ every run — see the Linux x64 job.
          clean: false

      - name: Set vanilla-ROM path (fixed location on this runner)
        run: |
          # This runner carries no FF6_VANILLA_ROM in its service environment;
          # the ROM lives at a fixed path instead, exported here so any
          # ROM-consuming step sees the fleet-standard variable.
          echo "FF6_VANILLA_ROM=$HOME/ci-assets/ostinatovi/FF3-1.1-U.smc" >> "$GITHUB_ENV"

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # See the Linux x64 job for why only the engine is initialized, why the
          # credential is supplied per-invocation rather than written to git config,
          # and why a persistent workspace has to sync before it updates.
          git submodule sync --recursive -- engine
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf .git/modules/engine
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Stage the text corpus (rip products the text tests read)
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE"
          # The text-corpus tests read the ripped .dat files out of the upstream
          # disassembly, so this build DOES need original-src. Without this step
          # they skip — and a skip that happens on only some runners hides those
          # tests behind a green tick, which is what it did until 2026-08-25.
          git submodule update --init -- original-src
          if [ -z "${FF6_VANILLA_ROM:-}" ] || [ ! -f "${FF6_VANILLA_ROM}" ]; then
            echo "FF6_VANILLA_ROM is unset or missing on this runner." >&2
            echo "The text tests need the rip corpus; a missing ROM is a provisioning defect, not a skip." >&2
            exit 1
          fi
          # extract_assets.py needs numpy. Prefer the runner's python3; fall back
          # to a venv cached once on the machine.
          RIP_BIN="$(command -v python3)"
          if ! "$RIP_BIN" -c 'import numpy' 2>/dev/null; then
            VENV="$HOME/.cache/ostinatovi-rip-venv"
            if [ ! -x "$VENV/bin/python3" ]; then
              python3 -m venv "$VENV"
              "$VENV/bin/pip" --quiet install numpy
            fi
            RIP_BIN="$VENV/bin/python3"
          fi
          "$RIP_BIN" -c 'import numpy'   # hard proof before ripping
          mkdir -p original-src/vanilla
          cp "$FF6_VANILLA_ROM" original-src/vanilla/
          cd original-src
          # The three steps the upstream `rip` target runs, invoked directly so
          # the step needs no make on any platform.
          "$RIP_BIN" tools/extract_assets.py
          "$RIP_BIN" tools/fix_dlg.py combine en
          "$RIP_BIN" tools/fix_dlg.py combine jp

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      - name: Stage build for manual testing
        run: |
          # Whole build directory to /tmp for the machine's owner — see the Linux x64 job.
          rm -rf /tmp/ostinato-vi-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/ostinato-vi-build

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code masks ctest failures
          export SDL_VIDEODRIVER=offscreen   # headless: SDL video init succeeds so the GPU device (lavapipe) is reachable
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-arm64-test-results.txt"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-test-results
          path: ci-output/

  # ── Windows ARM64 (WINMACARM64, self-hosted) ─────────────────────────────────
  # Third link of the serial ARM64 chain — see the Linux ARM64 job comment.
  build-windows-arm64:
    name: Windows clang-cl (WINMACARM64, ARM64)
    runs-on: [self-hosted, Windows, ARM64, WINMACARM64]
    needs: build-linux-arm64
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set vanilla-ROM path (fixed location on this runner)
        shell: powershell
        run: |
          # This runner carries no FF6_VANILLA_ROM machine variable; the ROM
          # lives at a fixed path instead, exported here so any ROM-consuming
          # step sees the fleet-standard variable.
          Add-Content -Path $env:GITHUB_ENV -Value "FF6_VANILLA_ROM=C:\ci-assets\ostinatovi\FF3-1.1-U.smc"

      - name: Init engine submodule
        shell: powershell
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd $env:GITHUB_WORKSPACE
          # See the Linux x64 job for why only the engine is initialized, why the
          # credential is supplied per-invocation rather than written to git config,
          # and why a persistent workspace has to sync before it updates.
          git submodule sync --recursive -- engine
          git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
          if ($LASTEXITCODE -ne 0) {
            git submodule deinit -f -- engine
            Remove-Item -Recurse -Force .git/modules/engine -ErrorAction SilentlyContinue
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Stage the text corpus (rip products the text tests read)
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          # See the Linux x64 job: the text-corpus tests read the ripped .dat
          # files, so this build needs original-src and the ROM. A missing ROM is
          # a provisioning defect, not a skip.
          git submodule update --init -- original-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $env:FF6_VANILLA_ROM -or -not (Test-Path $env:FF6_VANILLA_ROM)) {
            Write-Error "FF6_VANILLA_ROM is unset or missing on this runner."
            exit 1
          }
          $rip = "python"
          & $rip -c "import numpy" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $venv = "$env:USERPROFILE\.cache\ostinatovi-rip-venv"
            if (-not (Test-Path "$venv\Scripts\python.exe")) {
              & $rip -m venv $venv
              & "$venv\Scripts\pip.exe" --quiet install numpy
            }
            $rip = "$venv\Scripts\python.exe"
          }
          & $rip -c "import numpy"   # hard proof before ripping
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path original-src\vanilla | Out-Null
          Copy-Item $env:FF6_VANILLA_ROM original-src\vanilla\ -Force
          cd original-src
          # The three steps the upstream `rip` target runs, invoked directly so
          # the step needs no make on Windows.
          & $rip tools/extract_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rip tools/fix_dlg.py combine en
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rip tools/fix_dlg.py combine jp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\ostinato-vi-ci-build `
            -G "Visual Studio 17 2022" -A ARM64 -T ClangCL
          if ($LASTEXITCODE -ne 0) {
            # A cache written by a different generator or toolset cannot be reused, and
            # CMake will not overwrite it — see the Windows x64 job.
            Remove-Item C:\ostinato-vi-ci-build -Recurse -Force -ErrorAction SilentlyContinue
            cmake -S $env:GITHUB_WORKSPACE -B C:\ostinato-vi-ci-build `
              -G "Visual Studio 17 2022" -A ARM64 -T ClangCL
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: powershell
        run: cmake --build C:\ostinato-vi-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\ci-output | Out-Null
          # Run-unique results name so a stale handle can never block the write —
          # see the Windows x64 job.
          Get-ChildItem C:\ci-output\windows-arm64-test-results*.txt -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          $results = "C:\ci-output\windows-arm64-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\ostinato-vi-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell equivalent of `set -o pipefail` — see the Windows x64 job.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-test-results
          path: C:\ci-output\windows-arm64-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt

  # ── Parser unit tests (beefserve, self-hosted, x64) ──────────────────────────
  # Port-time asm parsers are Python 3 stdlib only — no C++ toolchain, no engine.
  # The emitted artifacts (include/ostinato/*.h, the fixture) are committed and
  # built by the C++ jobs above; this job guards the PARSERS themselves against
  # helper-logic / structural-assert / API-rename regressions on every push.
  parser-tests:
    name: Parser unit tests (beefserve, x64)
    runs-on: [self-hosted, X64, Linux, beefserve]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job shares beefserve's workspace with the Linux build job; the
          # default clean here would wipe that job's persisted build/.
          clean: false

      - name: Init upstream disassembly submodule (const.inc for parser e2e)
        run: |
          cd "$GITHUB_WORKSPACE"
          # original-src is public (no PAT). const.inc and char_prop.asm are
          # committed disassembly sources, so their end-to-end layers run against
          # the real contract with no ROM. Rip products (rng_tbl.dat) come from
          # the staging step below.
          git submodule update --init -- original-src

      - name: Stage vanilla ROM and rip (rip-product e2e corpus)
        run: |
          cd "$GITHUB_WORKSPACE"
          # Rip-product end-to-end tests (rng_tbl.dat, and later units) run full
          # only when the runner provides a vanilla ROM via FF6_VANILLA_ROM;
          # without it they skip visibly in the unittest output below.
          #
          # The upstream rip (tools/extract_assets.py) needs numpy. Prefer the
          # runner's python3; fall back to a cached venv built once on this
          # runner. If neither can provide numpy the step fails loudly — with a
          # ROM provisioned, a missing rip dependency is a provisioning defect,
          # not a skip.
          if [ -n "${FF6_VANILLA_ROM:-}" ] && [ -f "$FF6_VANILLA_ROM" ]; then
            RIP_BIN="$(command -v python3)"
            if ! "$RIP_BIN" -c 'import numpy' 2>/dev/null; then
              VENV="$HOME/.cache/ostinatovi-rip-venv"
              if [ ! -x "$VENV/bin/python3" ]; then
                python3 -m venv "$VENV"
                "$VENV/bin/pip" --quiet install numpy
              fi
              RIP_BIN="$VENV/bin/python3"
            fi
            "$RIP_BIN" -c 'import numpy'   # hard proof before ripping
            mkdir -p original-src/vanilla
            cp "$FF6_VANILLA_ROM" original-src/vanilla/
            PATH="$(dirname "$RIP_BIN"):$PATH" make -C original-src rip
          else
            echo "FF6_VANILLA_ROM not set on this runner — rip-product e2e will skip visibly."
          fi

      - name: Run parser unit tests
        run: |
          set -o pipefail   # propagate unittest's exit code through tee
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          python3 -m unittest discover -s tools/asm_parser -p 'test_parse_*.py' -v \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/parser-test-results.txt"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: parser-test-results
          path: ci-output/
